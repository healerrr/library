name: copyguard

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copyguard}
      POSTGRES_USER: ${POSTGRES_USER:-copyguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 bash deploy.sh 生成生产环境密码}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  backend:
    init: true
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-copyguard}
      POSTGRES_USER: ${POSTGRES_USER:-copyguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先运行 bash deploy.sh 生成生产环境密码}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-zh-v1.5}
      EMBEDDING_DIMENSION: "512"
      FASTEMBED_CACHE_PATH: /models
      PRELOAD_EMBEDDING_MODEL: ${PRELOAD_EMBEDDING_MODEL:-true}
      SIMILARITY_LEXICAL_WEIGHT: ${SIMILARITY_LEXICAL_WEIGHT:-0.45}
      SIMILARITY_SEMANTIC_WEIGHT: ${SIMILARITY_SEMANTIC_WEIGHT:-0.55}
      SIMILARITY_CHEMICAL_DISCOUNT: ${SIMILARITY_CHEMICAL_DISCOUNT:-0.70}
      SIMILARITY_MIN_SCORE: ${SIMILARITY_MIN_SCORE:-0.60}
      SIMILARITY_CANDIDATE_LIMIT: ${SIMILARITY_CANDIDATE_LIMIT:-200}
      CRAWLER_MAX_PAGES: ${CRAWLER_MAX_PAGES:-100}
      CRAWLER_TIMEOUT_SECONDS: ${CRAWLER_TIMEOUT_SECONDS:-15}
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:-CopyGuardBot/1.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - embedding_models:/models
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  frontend:
    init: true
    build:
      context: ./frontend
      args:
        NUXT_PUBLIC_API_BASE: /api
        NUXT_API_PROXY_TARGET: http://backend:8000/api
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_PROXY_TARGET: http://backend:8000/api
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_data:
  embedding_models:
